apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: chief-app
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chief-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chief-app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: chief-ai-assistant:local
          envFrom:
            - secretRef: {name: chief-environment}
          command: [sh, -c, "python -m scripts.wait_database && alembic upgrade head"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
      containers:
        - name: backend
          image: chief-ai-assistant:local
          envFrom:
            - secretRef: {name: chief-environment}
          env:
            - {name: BACKEND_URL, value: "http://127.0.0.1:8000"}
            - {name: FILE_DIRECTORY, value: /srv/data/documents}
          command: [uvicorn, app.api:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
          volumeMounts:
            - {name: documents, mountPath: /srv/data/documents}
        - name: telegram
          image: chief-ai-assistant:local
          envFrom:
            - secretRef: {name: chief-environment}
          env:
            - {name: BACKEND_URL, value: "http://127.0.0.1:8000"}
            - {name: FILE_DIRECTORY, value: /srv/data/documents}
          command: [python, -m, app.workers, telegram]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            exec: {command: [python, -m, app.health, telegram]}
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec: {command: [python, -m, app.health, telegram]}
            timeoutSeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec: {command: [python, -m, app.health, telegram]}
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 8
        - name: background
          image: chief-ai-assistant:local
          envFrom:
            - secretRef: {name: chief-environment}
          env:
            - {name: BACKEND_URL, value: "http://127.0.0.1:8000"}
            - {name: FILE_DIRECTORY, value: /srv/data/documents}
          command: [python, -m, app.workers, background]
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 768Mi}
          startupProbe:
            exec: {command: [python, -m, app.health, background]}
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec: {command: [python, -m, app.health, background]}
            timeoutSeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec: {command: [python, -m, app.health, background]}
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 8
          volumeMounts:
            - {name: documents, mountPath: /srv/data/documents}
      volumes:
        - name: documents
          persistentVolumeClaim: {claimName: documents}
