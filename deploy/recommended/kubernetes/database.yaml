apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app.kubernetes.io/name: chief-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chief-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chief-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          env:
            - name: POSTGRES_DB
              value: assistant
            - name: POSTGRES_USER
              value: assistant
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chief-environment
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          startupProbe:
            exec:
              command: [pg_isready, -U, assistant, -d, assistant]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, assistant, -d, assistant]
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, assistant, -d, assistant]
            timeoutSeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: postgres
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: yc-network-hdd
        resources:
          requests:
            storage: 10Gi
