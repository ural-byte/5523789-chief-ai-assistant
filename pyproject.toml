[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0", "httpx==0.28.1", "SQLAlchemy==2.0.43", "psycopg[binary]==3.2.10", "alembic==1.17.0", "pydantic-settings==2.11.0", "pgvector==0.4.1", "python-multipart==0.0.20", "dateparser==1.2.2", "greenlet==3.2.4", "pypdf==6.1.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
